  #     mongodb:
  #       condition: service_healthy
  #   networks:
  #     - crime-network
  #   volumes:
  #     - ./server:/app
  #     - /app/node_modules

volumes:
  mongodb_data:
    driver: local

networks:
  crime-network:
    driver: bridge
