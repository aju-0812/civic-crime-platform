version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: crime-reporting-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: crime-reporting
    volumes:
      - mongodb_data:/data/db
    networks:
      - crime-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend service (commented - run locally for development)
